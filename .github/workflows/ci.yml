name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      FULLGUETE_MODO: simulado
      FULLGUETE_CENARIO_DEMO: nao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Estilo (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (pytest)
        run: pytest
