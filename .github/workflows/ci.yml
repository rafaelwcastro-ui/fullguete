name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      FULLGUETE_MODO: simulado
      FULLGUETE_CENARIO_DEMO: nao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt -r portal_api/requirements.txt
      - name: Estilo (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (pytest)
        run: |
          pytest
          python -m unittest -v portal_api.test_readonly

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
