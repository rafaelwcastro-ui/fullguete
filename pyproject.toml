[project]
name = "fullguete"
version = "2.0.0"
description = "Protótipo acadêmico FGV: geração de receita apoiada por IA com soluções Equifax"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legado", "fullguete 2.0", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # o ruff format cuida do comprimento das linhas

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
